name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK/NDK/CMake
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --no-parallel --stacktrace --info :app:assembleDebug 2>&1 | tee build-debug.log

      - name: Verify APK exists
        if: success()
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: luna-local-agent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luna-local-agent-build-diagnostics
          path: |
            build-debug.log
            app/.cxx/**/build.ninja
            app/.cxx/**/CMakeError.log
            app/.cxx/**/CMakeOutput.log
          if-no-files-found: warn
